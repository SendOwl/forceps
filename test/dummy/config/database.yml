# PostgreSQL version
#
#   gem install pg
#
#   Ensure the PostgreSQL gem is defined in your Gemfile
#   gem 'pg'
default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  username: postgres
  password: postgres
  host: localhost

development:
  <<: *default
  database: forceps_dummy_development

test:
  <<: *default
  database: forceps_dummy_test

remote:
  <<: *default
  database: forceps_dummy_remote

production:
  <<: *default
  database: forceps_dummy_production
